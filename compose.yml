name: easymeme

services:
  easymeme:
    build: .
    image: easymeme
    container_name: easymeme
    restart: unless-stopped

    # Unprivileged user. The app writes nothing to disk, but running as root
    # inside the container is a needless risk.
    user: "${EASYMEME_UID:-1000}:${EASYMEME_GID:-1000}"

    ports:
      - "${EASYMEME_PORT:-8104}:8000"

    environment:
      # Set to 1 to make the sticker library read-only: the grid still works,
      # but nothing can be added or deleted through the web UI.
      EASYMEME_STICKERS_RO: "${EASYMEME_STICKERS_RO:-}"

    # Memes are still built entirely in the browser. The only thing on disk is
    # the shared sticker library, which has to outlive the container.
    # ./data must be owned by EASYMEME_UID:EASYMEME_GID or the app will start
    # with stickers disabled and say so in its logs.
    volumes:
      - ./data:/app/data

    # The image is python:3.12-slim, so there is no curl or wget - probe the
    # health endpoint with the interpreter that is already there. The port is
    # read from the container env so it follows PORT if it is ever overridden.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,urllib.request; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:%s/api/health" % os.environ.get("PORT", "8000"), timeout=2).status == 200 else 1)
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
